[workspace]
members = ["tools/schema-extractor"]
default-members = ["."]
resolver = "3"

[package]
name = "magi-cloudflare-axi"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "ISC"
description = "Agent-native Cloudflare REST, GraphQL, and hosted MCP CLI"
repository = "https://github.com/magimetal/magi-cloudflare-axi"
homepage = "https://github.com/magimetal/magi-cloudflare-axi"
documentation = "https://github.com/magimetal/magi-cloudflare-axi#readme"
include = ["/src/**", "/tests/**", "/docs/**", "/capabilities/**", "/skills/**", "/README.md", "/LICENSE", "/CHANGELOG.md", "/THIRD_PARTY_NOTICES.md", "/Cargo.lock"]

[[bin]]
name = "magi-cloudflare-axi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
toon-format = { version = "0.5", default-features = false }
jsonschema = { version = "=0.38.1", default-features = false }
sha2 = "=0.10.9"
url = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
