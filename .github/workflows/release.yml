name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: tar.gz
          - os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.87.0, components: "rustfmt,clippy" }
      - uses: taiki-e/install-action@e40e306b80d964fa5d3792fcbb48bf976d23dce8 # cargo-audit
      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match package v$version" >&2; exit 1; }
      - run: cargo fmt --all --check
      - run: cargo test --locked -p schema-extractor
      - run: cargo clippy --locked -p schema-extractor --all-targets -- -D warnings
      - run: cargo run --locked -p schema-extractor -- --self-test
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - run: cargo package --locked
      - run: cargo audit
      - name: Validate catalog and generated governance artifacts
        run: |
          python3 scripts/catalog-governance.py validate
          python3 scripts/catalog-governance.py check
          python3 scripts/catalog-governance.py self-test
          python3 scripts/extract-capability-names --self-test
      - name: Validate pinned registered-tool inventory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/mcp-server-cloudflare
          git -C /tmp/mcp-server-cloudflare remote add origin https://github.com/cloudflare/mcp-server-cloudflare.git
          git -C /tmp/mcp-server-cloudflare fetch --depth 1 origin 70ff690553722f731849ede6ba9ce98958395a23
          git -C /tmp/mcp-server-cloudflare checkout --detach FETCH_HEAD
          cargo run --locked -p schema-extractor -- census /tmp/mcp-server-cloudflare > /tmp/census-a.json
          cargo run --locked -p schema-extractor -- census /tmp/mcp-server-cloudflare > /tmp/census-b.json
          cmp /tmp/census-a.json /tmp/census-b.json
          python3 -c 'import json; x=json.load(open("/tmp/census-a.json")); assert x["version"] == "5" and x["extractor_version"] == "phase1-oxc-0.5" and x["provenance_claim"] == "schema_source_provenance_only" and x["source_access"] == "pinned_git_blobs" and x["schema_semantics"] == "not_attempted" and x["file_count"] == 114 and x["source_count"] == x["catalog_count"] == 172 and len(x["records"]) == 172 and not x["missing"] and not x["duplicates"] and not x["extra"] and x["expression_kind_counts"] == {"zod_object_call":139,"object_shape":29,"zero_input":4} and x["direct_binding_kind_counts"] == {"named_import":408,"same_file_initializer":48} and x["target_status_counts"] == {"pinned_internal_value":408,"same_file_value":48} and x["dependency_node_count"] == len(x["dependency_nodes"]) == 217 and x["dependency_edge_count"] == 269 and x["dependency_resolution_chain_count"] == 642 and x["dependency_max_depth"] == 4 and x["distinct_dependency_value_hash_count"] == 208 and x["dependency_value_kind_counts"] == {"function_declaration":4,"variable_initializer":213} and x["dependency_boundary_kind_counts"] == {"external_package_boundary":18,"language_builtin_boundary":17,"lexical_parameter_boundary":1} and not x["unsupported_dependency_construct_counts"]; from collections import Counter; assert Counter(r["schema_root_kind"] for r in x["records"]) == {"input_schema":139,"dex_raw_shape":18,"casb_params":11,"implicit_zero_input":4}; assert all(b["target_status"] in {"pinned_internal_value", "same_file_value"} and b["dependency_root_id"] and b["dependency_closure_ids"] and b["dependency_resolution_chains"] and b["dependency_max_depth"] <= 4 for r in x["records"] for b in r["direct_bindings"]); assert all(b["file"] and b["blob_oid"] and b["source_span"]["start_byte"] < b["source_span"]["end_byte"] for b in x["dependency_boundaries"])'
          ./scripts/extract-capability-names /tmp/mcp-server-cloudflare
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name="magi-cloudflare-axi-${GITHUB_REF_NAME}-${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir "$name"
          cp target/release/magi-cloudflare-axi "$name/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$name/"
          mkdir -p "$name/skills/magi-cloudflare-axi"
          cp skills/magi-cloudflare-axi/SKILL.md "$name/skills/magi-cloudflare-axi/"
          "$name/magi-cloudflare-axi" --version
          env -u CLOUDFLARE_API_BASE -u CLOUDFLARE_ENDPOINT -u CLOUDFLARE_API_TOKEN \
            -u CLOUDFLARE_API_KEY -u CLOUDFLARE_API_EMAIL -u CLOUDFLARE_ACCOUNT_ID \
            -u CLOUDFLARE_ACOUNT_ID -u CLOUDFLARE_ZONE_ID \
            HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" \
            "$name/magi-cloudflare-axi" --format json > /dev/null
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os }}
          path: '*.tar.gz*'
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
