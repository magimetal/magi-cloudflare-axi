name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: tar.gz
          - os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.87.0, components: "rustfmt,clippy" }
      - uses: taiki-e/install-action@e40e306b80d964fa5d3792fcbb48bf976d23dce8 # cargo-audit
      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match package v$version" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - run: cargo package --locked
      - run: cargo audit
      - name: Validate pinned registered-tool inventory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/mcp-server-cloudflare
          git -C /tmp/mcp-server-cloudflare remote add origin https://github.com/cloudflare/mcp-server-cloudflare.git
          git -C /tmp/mcp-server-cloudflare fetch --depth 1 origin 70ff690553722f731849ede6ba9ce98958395a23
          git -C /tmp/mcp-server-cloudflare checkout --detach FETCH_HEAD
          ./scripts/extract-capability-names /tmp/mcp-server-cloudflare
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name="magi-cloudflare-axi-${GITHUB_REF_NAME}-${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir "$name"
          cp target/release/magi-cloudflare-axi "$name/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$name/"
          mkdir -p "$name/skills/magi-cloudflare-axi"
          cp skills/magi-cloudflare-axi/SKILL.md "$name/skills/magi-cloudflare-axi/"
          "$name/magi-cloudflare-axi" --version
          env -u CLOUDFLARE_API_BASE -u CLOUDFLARE_ENDPOINT -u CLOUDFLARE_API_TOKEN \
            -u CLOUDFLARE_API_KEY -u CLOUDFLARE_API_EMAIL -u CLOUDFLARE_ACCOUNT_ID \
            -u CLOUDFLARE_ACOUNT_ID -u CLOUDFLARE_ZONE_ID \
            HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" \
            "$name/magi-cloudflare-axi" --format json > /dev/null
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os }}
          path: '*.tar.gz*'
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
