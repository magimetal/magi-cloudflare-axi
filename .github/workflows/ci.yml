name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.87.0, components: "rustfmt,clippy" }
      - uses: taiki-e/install-action@e40e306b80d964fa5d3792fcbb48bf976d23dce8 # cargo-audit
      - run: cargo fmt --all --check
      - run: cargo test --locked -p schema-extractor
      - run: cargo clippy --locked -p schema-extractor --all-targets -- -D warnings
      - run: cargo run --locked -p schema-extractor -- --self-test
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - run: cargo package --locked
      - run: cargo audit
      - name: Validate catalog and generated governance artifacts
        run: |
          python3 scripts/catalog-governance.py validate
          python3 scripts/catalog-governance.py check
          python3 scripts/catalog-governance.py self-test
          python3 scripts/extract-capability-names --self-test
          python3 scripts/catalog-governance.py metrics > /tmp/catalog-metrics.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/catalog-metrics.json"))["denominator"])')" = 172
      - name: Validate pinned registered-tool inventory
        run: |
          git init /tmp/mcp-server-cloudflare
          git -C /tmp/mcp-server-cloudflare remote add origin https://github.com/cloudflare/mcp-server-cloudflare.git
          git -C /tmp/mcp-server-cloudflare fetch --depth 1 origin 70ff690553722f731849ede6ba9ce98958395a23
          git -C /tmp/mcp-server-cloudflare checkout --detach FETCH_HEAD
          ./scripts/extract-capability-names /tmp/mcp-server-cloudflare
          cargo run --locked -p schema-extractor -- census /tmp/mcp-server-cloudflare > /tmp/schema-census-a.json
          cargo run --locked -p schema-extractor -- census /tmp/mcp-server-cloudflare > /tmp/schema-census-b.json
          cmp /tmp/schema-census-a.json /tmp/schema-census-b.json
          python3 -c 'import json; p=json.load(open("/tmp/schema-census-a.json")); assert p["version"] == "5" and p["extractor_version"] == "phase1-oxc-0.5" and p["provenance_claim"] == "schema_source_provenance_only" and p["source_access"] == "pinned_git_blobs" and p["schema_semantics"] == "not_attempted" and p["file_count"] == 114 and p["source_count"] == p["catalog_count"] == 172 and len(p["records"]) == 172 and not p["duplicates"] and not p["missing"] and not p["extra"] and p["expression_kind_counts"] == {"zod_object_call": 139, "object_shape": 29, "zero_input": 4} and p["direct_binding_kind_counts"] == {"named_import": 408, "same_file_initializer": 48} and p["target_status_counts"] == {"pinned_internal_value": 408, "same_file_value": 48} and p["dependency_node_count"] == len(p["dependency_nodes"]) == 217 and p["dependency_edge_count"] == 269 and p["dependency_resolution_chain_count"] == 642 and p["dependency_max_depth"] == 4 and p["distinct_dependency_value_hash_count"] == 208 and p["dependency_value_kind_counts"] == {"function_declaration": 4, "variable_initializer": 213} and p["dependency_boundary_kind_counts"] == {"external_package_boundary": 18, "language_builtin_boundary": 17, "lexical_parameter_boundary": 1} and not p["unsupported_dependency_construct_counts"]; from collections import Counter; assert Counter(r["schema_root_kind"] for r in p["records"]) == {"input_schema": 139, "dex_raw_shape": 18, "implicit_zero_input": 4, "casb_params": 11}; assert all(b["target_status"] in {"pinned_internal_value", "same_file_value"} and b["dependency_root_id"] and b["dependency_closure_ids"] and b["dependency_resolution_chains"] and b["dependency_max_depth"] <= 4 for r in p["records"] for b in r["direct_bindings"]); assert all(b["file"] and b["blob_oid"] and b["source_span"]["start_byte"] < b["source_span"]["end_byte"] for b in p["dependency_boundaries"])'
      - name: Clean install smoke test
        run: |
          root="$(mktemp -d)"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_API_KEY -u CLOUDFLARE_API_EMAIL \
            cargo install --path . --locked --root "$root"
          "$root/bin/magi-cloudflare-axi" --version
          env -u CLOUDFLARE_API_BASE -u CLOUDFLARE_ENDPOINT -u CLOUDFLARE_API_TOKEN \
            -u CLOUDFLARE_API_KEY -u CLOUDFLARE_API_EMAIL -u CLOUDFLARE_ACCOUNT_ID \
            -u CLOUDFLARE_ACOUNT_ID -u CLOUDFLARE_ZONE_ID \
            HOME="$root/home" XDG_CONFIG_HOME="$root/config" \
            "$root/bin/magi-cloudflare-axi" --format json > /tmp/home.json
          python3 -c 'import json; value=json.load(open("/tmp/home.json")); assert value["live"]["status"] == "not_configured"'
