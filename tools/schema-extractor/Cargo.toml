[package]
name = "schema-extractor"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "ISC"
publish = false

[dependencies]
oxc_allocator = "=0.75.1"
oxc_ast = "=0.75.1"
oxc_ast_visit = "=0.75.1"
oxc_parser = { version = "=0.75.1", default-features = false }
oxc_span = "=0.75.1"
oxc_syntax = "=0.75.1"
oxc_index = "=3.1.0"
oxc_semantic = "=0.75.1"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "schema-extractor"
path = "src/main.rs"
